<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLICK</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cards.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <div id="header"></div>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <section class="hero">


        <!-- LEFT SIDE -->

        <div class="hero-content">


            <div class="hero-top">

                <span class="tag">
                    AI-POWERED SENTIMENT ANALYSIS
                </span>

            </div>


            <h1 class="hero-title">

                <span class="word">
                    Turn
                </span>

                <span class="word">
                    movie
                </span>

                <span class="word">
                    reviews
                </span>

                <span class="word">
                    into
                </span>

                <span class="word">
                    AI-Powered
                </span>

                <span class="word">
                    insights.
                </span>

            </h1>


            <p class="hero-desc">

                Analyze audience reviews with NLP and instantly discover
                sentiment, confidence, and what viewers really think.

            </p>


            <div class="hero-buttons">


                <a
                    href="analysis.html"
                    class="btn-primary"
                >
                    ANALYZE REVIEW →
                </a>


            


            </div>


        </div>


        <!-- =========================
             RIGHT SIDE - CUBE
        ========================== -->

        <div class="cube-container">

            <div id="cube"></div>

        </div>


    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <div id="footer"></div>


    <!-- =========================
         COMPONENTS
    ========================== -->

    <script src="components.js"></script>


    <!-- =========================
         CUBE LOADER
    ========================== -->

    <script>

        fetch("cube.html")

            .then(
                response =>
                    response.text()
            )

            .then(
                html => {

                    document
                        .getElementById("cube")
                        .innerHTML = html;


                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        "cube.js";


                    document.body.appendChild(
                        script
                    );

                }
            )

            .catch(
                error => {

                    console.error(
                        "Failed to load cube:",
                        error
                    );

                }
            );

    </script>


</body>

</html>
