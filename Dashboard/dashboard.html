<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLICK | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f6f4;
            color: #171a21;
        }

        nav {
            height: 70px;
            background: #11151d;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 45px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #logout {
            padding: 9px 18px;
            border: 1px solid #555;
            border-radius: 7px;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        #logout:hover {
            background: white;
            color: #11151d;
        }

        .dashboard {
            max-width: 900px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        .dashboard h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .dashboard p {
            color: #777;
            margin-bottom: 35px;
        }

        .review-card {
            background: white;
            padding: 30px;
            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            text-align: left;
        }

        .review-card label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 170px;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #d6a84f;
        }

        .analyze {
            margin-top: 20px;

            padding: 13px 30px;

            background: #11151d;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            ▶ FLICK
        </div>

        <div class="user-area">

            <span id="userName"></span>

            <button id="logout">
                Logout
            </button>

        </div>

    </nav>


    <main class="dashboard">

        <h1>
            Movie Review Sentiment Analysis
        </h1>

        <p>
            Understand the emotion behind every review.
        </p>


        <div class="review-card">

            <label>
                Enter your movie review
            </label>

            <textarea
                placeholder="Write or paste a movie review here..."
            ></textarea>


            <button class="analyze">
                Analyze Review →
            </button>

        </div>

    </main>


    <script>

        /* Get the logged-in user */

        const currentUser = JSON.parse(
            localStorage.getItem("movieMindCurrentUser")
        );


        /* Display user */

        if (currentUser) {

            document.getElementById("userName").textContent =
                "Welcome, " + currentUser.name;

        }


        /* Logout */

        document
            .getElementById("logout")
            .addEventListener("click", function () {

                localStorage.removeItem(
                    "movieMindCurrentUser"
                );

                window.location.href = "login.html";

            });

    </script>

</body>

</html>
