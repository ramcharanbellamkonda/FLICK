<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLICK | Review History</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/cards.css">

    <style>

        /* =====================================================
           HISTORY PAGE
        ===================================================== */

        .history-page {

            min-height: 100vh;

            padding:
                140px 8% 100px;

        }


        .history-header {

            max-width: 800px;

            margin-bottom: 50px;

        }


        .history-header h1 {

            font-size: 64px;

            line-height: 1;

            margin:
                20px 0;

        }


        .history-header p {

            font-size: 18px;

            line-height: 1.7;

            opacity: 0.7;

        }


        /* =====================================================
           STATISTICS
        ===================================================== */

        .history-stats {

            max-width: 1100px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 16px;

            margin-bottom: 50px;

        }


        .history-stat-card {

            padding: 24px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 16px;

            background:
                rgba(255,255,255,0.04);

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .history-stat-label {

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.08em;

            opacity: 0.55;

        }


        .history-stat-card strong {

            font-size: 32px;

            line-height: 1;

        }


        /* =====================================================
           HISTORY LIST
        ===================================================== */

        .history-list {

            max-width: 1100px;

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        /* =====================================================
           CLEAR ALL
        ===================================================== */

        .history-actions {

            display: flex;

            justify-content: flex-end;

            margin-bottom: 10px;

        }


        .clear-history-btn {

            padding:
                12px 18px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 8px;

            background: transparent;

            color: inherit;

            cursor: pointer;

            font-weight: 700;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

        }


        .clear-history-btn:hover {

            opacity: 0.7;

            transform:
                translateY(-1px);

        }


        /* =====================================================
           HISTORY CARD
        ===================================================== */

        .history-card {

            padding: 28px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 18px;

            background:
                rgba(255,255,255,0.04);

        }


        .history-card-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .history-sentiment {

            display: inline-block;

            padding:
                8px 14px;

            border-radius: 999px;

            font-size: 13px;

            font-weight: 700;

        }


        .history-sentiment.positive {

            background:
                rgba(40,200,120,0.15);

        }


        .history-sentiment.negative {

            background:
                rgba(240,70,70,0.15);

        }


        .history-sentiment.neutral {

            background:
                rgba(180,180,180,0.15);

        }


        .history-date {

            font-size: 13px;

            opacity: 0.55;

        }


        .history-review {

            font-size: 18px;

            line-height: 1.7;

            margin:
                0 0 24px;

            word-break: break-word;

        }


        .history-card-bottom {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 14px;

            opacity: 0.8;

        }


        .history-card-bottom span {

            display: inline-block;

        }


        /* =====================================================
           DELETE BUTTON
        ===================================================== */

        .delete-history-btn {

            padding:
                8px 14px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 6px;

            background: transparent;

            color: inherit;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

            transition:
                opacity 0.2s ease;

        }


        .delete-history-btn:hover {

            opacity: 0.6;

        }


        /* =====================================================
           LOADING / EMPTY
        ===================================================== */

        .history-message {

            max-width: 700px;

            padding: 40px;

            text-align: center;

            margin:
                40px auto;

        }


        .history-message h2 {

            margin-bottom: 12px;

        }


        .history-message p {

            margin-bottom: 25px;

            opacity: 0.7;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 1000px) {

            .history-stats {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 820px) {

            .history-page {

                padding:
                    110px 20px 70px;

            }


            .history-header h1 {

                font-size: 46px;

            }


            .history-stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .history-card-top {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .history-card-bottom {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }

        }


        @media (max-width: 500px) {

            .history-stats {

                grid-template-columns:
                    1fr;

            }


            .history-card {

                padding: 20px;

            }

        }

    
        /* =====================================================
           MOVIE OVERALL RATING
           ===================================================== */

        .history-movie-header {

            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

        }

        .history-movie-poster {

            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;

        }

        .history-movie-info h2 {

            margin: 0 0 8px;

        }

        .history-movie-info p {

            margin: 6px 0 0;
            opacity: .65;

        }

        .history-overall-rating {

            display: flex;
            align-items: center;
            gap: 10px;

        }

        .history-overall-stars,
        .history-review-stars {

            letter-spacing: 2px;
            font-size: 20px;

        }

        .history-empty-stars {

            opacity: .18;

        }

        .history-review-stars {

            margin: 8px 0;

        }

</style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <div id="header"></div>


    <!-- =====================================================
         MAIN HISTORY PAGE
    ====================================================== -->

    <main class="history-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <section class="history-header">

            <p class="tag">
                YOUR ANALYSIS HISTORY
            </p>


            <h1>
                Review History
            </h1>


            <p>
                See the movie reviews you have
                analyzed with FLICK.
            </p>

        </section>


        <!-- =================================================
             STATISTICS
        ================================================== -->

        <section class="history-stats">


            <div class="history-stat-card">

                <span class="history-stat-label">
                    TOTAL REVIEWS
                </span>

                <strong id="totalReviews">
                    0
                </strong>

            </div>


            <div class="history-stat-card">

                <span class="history-stat-label">
                    POSITIVE
                </span>

                <strong id="positiveReviews">
                    0
                </strong>

            </div>


            <div class="history-stat-card">

                <span class="history-stat-label">
                    NEGATIVE
                </span>

                <strong id="negativeReviews">
                    0
                </strong>

            </div>


            <div class="history-stat-card">

                <span class="history-stat-label">
                    NEUTRAL
                </span>

                <strong id="neutralReviews">
                    0
                </strong>

            </div>


            <div class="history-stat-card">

                <span class="history-stat-label">
                    AVG CONFIDENCE
                </span>

                <strong id="averageConfidence">
                    0%
                </strong>

            </div>


        </section>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="historyLoading"
            class="history-message"
        >

            Loading your history...

        </div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="historyEmpty"
            class="history-message"
            style="display:none;"
        >

            <h2>
                No reviews yet
            </h2>


            <p>
                Analyze your first movie review
                and it will appear here.
            </p>


            <a
                href="/analysis.html"
                class="btn-primary"
            >
                ANALYZE A REVIEW →
            </a>

        </div>


        <!-- =================================================
             HISTORY LIST
        ================================================== -->

        <section
            id="historyList"
            class="history-list"
        ></section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="footer"></div>


    <!-- =====================================================
         COMPONENT LOADER
    ====================================================== -->

    <script src="/components.js"></script>


    <!-- =====================================================
         HISTORY JAVASCRIPT
    ====================================================== -->

    <script>


        // =====================================================
        // LOAD HISTORY WHEN PAGE LOADS
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            loadHistory
        );



        // =====================================================
        // LOAD USER HISTORY
        // =====================================================

        async function loadHistory() {


            const loading =
                document.getElementById(
                    "historyLoading"
                );


            const empty =
                document.getElementById(
                    "historyEmpty"
                );


            const list =
                document.getElementById(
                    "historyList"
                );


            try {


                const response =
                    await fetch(
                        "/api/history",
                        {
                            method: "GET",

                            credentials:
                                "include",

                            cache:
                                "no-store"
                        }
                    );


                const data =
                    await response.json();



                // =================================================
                // LOGIN REQUIRED
                // =================================================

                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login.html";

                    return;

                }



                // =================================================
                // API ERROR
                // =================================================

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not load history."
                    );

                }



                loading.style.display =
                    "none";



                const history =
                    data.history || [];



                // =================================================
                // CALCULATE STATISTICS
                // =================================================

                let positive = 0;

                let negative = 0;

                let neutral = 0;

                let confidenceTotal = 0;

                let confidenceCount = 0;



                history.forEach(
                    function (item) {


                        const sentiment =
                            String(
                                item.sentiment ||
                                ""
                            ).toLowerCase();



                        if (
                            sentiment ===
                            "positive"
                        ) {

                            positive++;

                        }


                        else if (
                            sentiment ===
                            "negative"
                        ) {

                            negative++;

                        }


                        else if (
                            sentiment ===
                            "neutral"
                        ) {

                            neutral++;

                        }



                        // =========================================
                        // CONFIDENCE
                        // =========================================

                        if (
                            item.confidence !== null &&
                            item.confidence !== undefined &&
                            !isNaN(
                                item.confidence
                            )
                        ) {

                            confidenceTotal +=
                                Number(
                                    item.confidence
                                );

                            confidenceCount++;

                        }

                    }
                );



                const total =
                    history.length;



                const averageConfidence =
                    confidenceCount > 0

                        ? Math.round(
                            confidenceTotal /
                            confidenceCount
                        )

                        : 0;



                // =================================================
                // UPDATE STATISTICS
                // =================================================

                document.getElementById(
                    "totalReviews"
                ).textContent =
                    total;


                document.getElementById(
                    "positiveReviews"
                ).textContent =
                    positive;


                document.getElementById(
                    "negativeReviews"
                ).textContent =
                    negative;


                document.getElementById(
                    "neutralReviews"
                ).textContent =
                    neutral;


                document.getElementById(
                    "averageConfidence"
                ).textContent =
                    averageConfidence + "%";



                // =================================================
                // EMPTY HISTORY
                // =================================================

                if (
                    history.length === 0
                ) {

                    empty.style.display =
                        "block";

                    list.innerHTML =
                        "";

                    return;

                }



                empty.style.display =
                    "none";



                // =================================================
                // CLEAR ALL BUTTON
                // =================================================

                list.innerHTML =
                    "";


                const actions =
                    document.createElement(
                        "div"
                    );


                actions.className =
                    "history-actions";


                const clearButton =
                    document.createElement(
                        "button"
                    );


                clearButton.textContent =
                    "CLEAR ALL HISTORY";


                clearButton.className =
                    "clear-history-btn";


                clearButton.addEventListener(
                    "click",
                    clearAllHistory
                );


                actions.appendChild(
                    clearButton
                );


                list.appendChild(
                    actions
                );



                // =================================================
                // GROUP REVIEWS BY MOVIE
                // =================================================

                const movieGroups = new Map();

                history.forEach(function (item) {

                    const movieId =
                        item.movie_id ??
                        item.movieId ??
                        item.movie_title ??
                        item.movieTitle ??
                        "unknown";

                    const movieTitle =
                        item.movie_title ||
                        item.movieTitle ||
                        "Unknown Movie";

                    const moviePoster =
                        item.movie_poster ||
                        item.moviePoster ||
                        "";

                    const key = String(movieId);

                    if (!movieGroups.has(key)) {

                        movieGroups.set(key, {
                            title: movieTitle,
                            poster: moviePoster,
                            reviews: []
                        });

                    }

                    const group =
                        movieGroups.get(key);

                    if (
                        group.title === "Unknown Movie" &&
                        movieTitle !== "Unknown Movie"
                    ) {
                        group.title = movieTitle;
                    }

                    if (
                        !group.poster &&
                        moviePoster
                    ) {
                        group.poster = moviePoster;
                    }

                    group.reviews.push(item);

                });


                // =================================================
                // ONE RATING PER MOVIE
                // =================================================

                movieGroups.forEach(function (group) {

                    const movieSection =
                        document.createElement("section");

                    movieSection.className =
                        "history-movie-group";


                    const ratings =
                        group.reviews
                            .map(function (item) {

                                const savedRating =
                                    Number(
                                        item.review_rating ??
                                        item.rating ??
                                        NaN
                                    );

                                if (
                                    Number.isFinite(
                                        savedRating
                                    ) &&
                                    savedRating >= 1 &&
                                    savedRating <= 5
                                ) {
                                    return savedRating;
                                }


                                // Fallback for older history entries
                                // that were saved before rating support.

                                const sentiment =
                                    String(
                                        item.sentiment ||
                                        "Neutral"
                                    ).toLowerCase();


                                const confidence =
                                    Number(
                                        item.confidence
                                    );


                                if (
                                    sentiment === "positive"
                                ) {

                                    return (
                                        Number.isFinite(
                                            confidence
                                        ) &&
                                        confidence >= 85
                                    )
                                        ? 5
                                        : 4;

                                }


                                if (
                                    sentiment === "negative"
                                ) {

                                    return (
                                        Number.isFinite(
                                            confidence
                                        ) &&
                                        confidence >= 85
                                    )
                                        ? 1
                                        : 2;

                                }


                                return 3;

                            });


                    const overallRating =
                        ratings.length
                            ? (
                                ratings.reduce(
                                    function (
                                        sum,
                                        value
                                    ) {
                                        return sum + value;
                                    },
                                    0
                                ) / ratings.length
                            ).toFixed(1)
                            : "3.0";


                    const roundedStars =
                        Math.max(
                            1,
                            Math.min(
                                5,
                                Math.round(
                                    Number(
                                        overallRating
                                    )
                                )
                            )
                        );


                    const stars =
                        "★".repeat(
                            roundedStars
                        ) +
                        '<span class="history-empty-stars">' +
                        "★".repeat(
                            5 - roundedStars
                        ) +
                        "</span>";


                    const poster =
                        group.poster
                            ? (
                                String(
                                    group.poster
                                ).startsWith("http")
                                    ? group.poster
                                    : "https://image.tmdb.org/t/p/w300" +
                                      group.poster
                            )
                            : "";


                    movieSection.innerHTML = `

                        <article class="history-card">

                            <div class="history-movie-header">

                                ${
                                    poster
                                        ? `
                                            <img
                                                src="${escapeHtml(
                                                    poster
                                                )}"
                                                alt="${escapeHtml(
                                                    group.title
                                                )}"
                                                class="history-movie-poster"
                                            >
                                        `
                                        : ""
                                }

                                <div
                                    class="history-movie-info"
                                >

                                    <h2>
                                        ${escapeHtml(
                                            group.title
                                        )}
                                    </h2>


                                    <div
                                        class="history-overall-rating"
                                    >

                                        <span
                                            class="history-overall-stars"
                                        >
                                            ${stars}
                                        </span>


                                        <strong>
                                            ${overallRating}/5
                                        </strong>

                                    </div>


                                    <p>
                                        ${
                                            group.reviews.length
                                        }
                                        ${
                                            group.reviews.length === 1
                                                ? "review"
                                                : "reviews"
                                        }
                                    </p>

                                </div>

                            </div>

                        </article>

                    `;


                    // IMPORTANT:
                    // Individual reviews are intentionally NOT
                    // rendered here. History now shows only the
                    // overall movie rating and review count.

                    list.appendChild(
                        movieSection
                    );

                });

            }


            catch (error) {


                console.error(
                    "History loading error:",
                    error
                );


                loading.textContent =
                    "Could not load your history.";

            }

        }



        // =====================================================
        // DELETE ONE HISTORY ITEM
        // =====================================================

        async function deleteHistory(
            historyId
        ) {


            const confirmed =
                confirm(
                    "Delete this review from your history?"
                );


            if (!confirmed) {

                return;

            }



            try {


                const response =
                    await fetch(
                        `/api/history/${historyId}`,
                        {
                            method:
                                "DELETE",

                            credentials:
                                "include"
                        }
                    );


                const data =
                    await response.json();



                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not delete review."
                    );

                }



                await loadHistory();


            }


            catch (error) {


                console.error(
                    "Delete history error:",
                    error
                );


                alert(
                    error.message
                );

            }

        }



        // =====================================================
        // CLEAR ALL HISTORY
        // =====================================================

        async function clearAllHistory() {


            const confirmed =
                confirm(
                    "Are you sure you want to delete ALL your review history?"
                );


            if (!confirmed) {

                return;

            }



            try {


                const response =
                    await fetch(
                        "/api/history/clear",
                        {
                            method:
                                "DELETE",

                            credentials:
                                "include"
                        }
                    );


                const data =
                    await response.json();



                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not clear history."
                    );

                }



                await loadHistory();


            }


            catch (error) {


                console.error(
                    "Clear history error:",
                    error
                );


                alert(
                    error.message
                );

            }

        }



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(
            value
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value ?? "";


            return div.innerHTML;

        }


    </script>


</body>

</html>
