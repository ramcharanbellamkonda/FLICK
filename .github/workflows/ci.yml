name: FLICK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Install Python dependencies
        working-directory: Dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test saved ML model
        working-directory: Dashboard
        run: |
          python test.py